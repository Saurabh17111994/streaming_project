# Streaming-3000 T3 G3 Compute — Flink p8 + network + RocksDB
# Single-host dev (docker-compose.yml) keeps 8 TaskSlots so p=8 runs without slot starvation.
# Scale target 3000 instruments @50k tps avg /90k cap (16 Fluss buckets → 8 slots, 2:1 hash(token) rebalance).
# This file documents the T3 pins; runtime truth is FLINK_PROPERTIES (compose/stack) + SignalJob.applyRuntimeOptions.
# Pinned by plan streaming-3000-flink-fluss-hardening.md T3: Validate MiniCluster p8 start OK, CompatRescale pass at 1k p8.

flink {
  parallelism = 8
  state.backend = "rocksdb"
  state.backend.incremental = true
  state.backend.rocksdb.localdir = "/tmp/flink-rocksdb" # SSD dirs — host SSD, not overlay
  taskmanager.memory.managed.fraction = 0.4
  taskmanager.memory.network.max = "256m"
  taskmanager.memory.network.min = "256m"
  taskmanager.numberOfTaskSlots = 8
  jobmanager.memory.process.size = "1600m"
  taskmanager.memory.process.size = "3g"
  taskmanager.memory.task.off-heap.size = "512m"
}
