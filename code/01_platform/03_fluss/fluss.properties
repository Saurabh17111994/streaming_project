# Fluss cluster properties (MVP defaults)
# Applied to the Fluss cluster config (server-side) so table-level DDL inherits them.
# These mirror the per-table options in 01_platform/02_sql/ddl/*.sql.

# Lake tiering (Iceberg on S3)
datalake.format=iceberg
datalake.bucket.num=8
datalake.s3.region=${AWS_REGION:-ap-south-1}
datalake.s3.endpoint=
datalake.warehouse.path=${S3_WAREHOUSE_PATH:-s3://trading-lake/warehouse}

# Bucketing default for new tables
bucket.num=8

# Coordinator / tablet (placeholder if you run Fluss outside Compose)
coordinator.host=${FLUSS_COORDINATOR_HOST:-fluss-coordinator}
coordinator.port=9123
tablet.host=${FLUSS_TABLET_HOST:-fluss-tablet}
