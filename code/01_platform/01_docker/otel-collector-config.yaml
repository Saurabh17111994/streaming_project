# OpenTelemetry Collector configuration for the trading platform.
#
# Receives OTLP gRPC (4317) and HTTP (4318) from all platform services
# and exports logs, metrics, and traces to the OpenObserve backend.
#
# See docs/04_contracts/openobserve.md for the full observability contract.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp/logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH_BASIC}
      stream-name: default
  otlphttp/metrics:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH_BASIC}
      stream-name: default
  otlphttp/traces:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: Basic ${env:O2_AUTH_BASIC}
      stream-name: default
  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
