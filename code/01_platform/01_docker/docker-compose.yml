# =============================================================================
# Docker Compose — Trading_project platform runtime (Phase 4.2 MVP topology)
#
# Services: fluss (coordinator + tablet), flink (jobmanager + taskmanager),
# ingestion, action-capture, compute, executor, openobserve.
#
# NOTE: image tags are placeholders. Pin concrete versions before first run
# (see 01_platform/03_fluss/FLUSS_VERSIONS.md). OpenAlgo runs as the repurposed execution
# engine (dumb executor) — its container is the upstream OpenAlgo image with an
# executor adapter mounted in. Secrets are NOT committed; copy 01_platform/01_docker/.env.example
# to 01_platform/01_docker/.env and fill values locally.
# =============================================================================

x-fluss-common: &fluss-common
  restart: unless-stopped
  networks: [trading-net]
  environment:
    FLUSS_BOOTSTRAP: fluss-coordinator:9123
    FLUSS_COORDINATOR_HOST: fluss-coordinator
    FLUSS_TABLET_HOST: fluss-tablet

x-flink-common: &flink-common
  restart: unless-stopped
  networks: [trading-net]
  depends_on: [fluss-coordinator]
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      rest.bind-address: 0.0.0.0
    FLUSS_BOOTSTRAP: fluss-coordinator:9123

networks:
  trading-net:
    driver: bridge

volumes:
  fluss-data:
  flink-checkpoints:
  openobserve-data:

services:
  # ---- Fluss: streaming bus + storage + lake tier -------------------------
  fluss-coordinator:
    <<: *fluss-common
    image: ${FLUSS_IMAGE:-fluss/fluss:latest}
    command: ["coordinator"]
    ports: ["9123:9123"]
    volumes: [fluss-data:/data]

  fluss-tablet:
    <<: *fluss-common
    image: ${FLUSS_IMAGE:-fluss/fluss:latest}
    command: ["tablet"]
    depends_on: [fluss-coordinator]
    volumes: [fluss-data:/data]
    # Lake tiering requires S3 creds (see 01_platform/01_docker/.env.example).

  # ---- Flink: compute (feature + signal + babysitter jobs) -----------------
  flink-jobmanager:
    <<: *flink-common
    image: ${FLINK_IMAGE:-flink:latest}
    command: ["jobmanager"]
    ports: ["8081:8081"]
    volumes: [flink-checkpoints:/checkpoints]

  flink-taskmanager:
    <<: *flink-common
    image: ${FLINK_IMAGE:-flink:latest}
    command: ["taskmanager"]
    depends_on: [flink-jobmanager]
    volumes: [flink-checkpoints:/checkpoints]

  # ---- Services -----------------------------------------------------------
  ingestion:
    <<: *fluss-common
    build: { context: ../../02_services/01_ingestion, dockerfile: Dockerfile }
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      KITE_API_KEY: ${KITE_API_KEY}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN}
      KITE_WS_URL: ${KITE_WS_URL}

  action-capture:
    <<: *fluss-common
    build: { context: ../../02_services/03_action_capture, dockerfile: Dockerfile }
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      KITE_API_KEY: ${KITE_API_KEY}
      KITE_API_SECRET: ${KITE_API_SECRET}
      KITE_POSTBACK_URL: ${KITE_POSTBACK_URL}

  compute:
    <<: *flink-common
    build: { context: ../../02_services/02_compute, dockerfile: Dockerfile }
    depends_on: [flink-jobmanager, flink-taskmanager]
    volumes: [flink-checkpoints:/checkpoints]
    # Submits feature-compute, signal-strategy, babysitter jobs on start.

  executor:
    <<: *fluss-common
    build: { context: ../../02_services/04_executor, dockerfile: Dockerfile }
    depends_on: [fluss-coordinator, fluss-tablet]
    environment:
      OPENALGO_BASE_URL: ${OPENALGO_BASE_URL:-http://openalgo:5000}
      OPENALGO_API_KEY: ${OPENALGO_API_KEY}
      FLUSS_BOOTSTRAP: fluss-coordinator:9123

  openalgo:
    <<: *fluss-common
    image: ${OPENALGO_IMAGE:-openalgo/openalgo:latest}
    ports: ["5000:5000"]
    environment:
      OPENALGO_API_KEY: ${OPENALGO_API_KEY}
    # Order-execution ONLY. NOT on the ingest path: the ingestion reuses OpenAlgo's
    # broker-plumbing code in-process (Python decode -> Java Fluss-client writer) and does
    # NOT connect to this container's :8765 tick proxy. This container is reached only by
    # executor over :5000 REST to place orders.

  # ---- Observability ------------------------------------------------------
  openobserve:
    <<: *fluss-common
    image: ${OPENOBSERVE_IMAGE:-openobserve/openobserve:latest}
    restart: unless-stopped
    ports: ["5080:5080"]
    environment:
      ZO_ROOT_USER_EMAIL: ${O2_USER:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${O2_PASSWORD}
    volumes: [openobserve-data:/data]
